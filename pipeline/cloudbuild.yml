# Cloud Build Pipeline Configuration for GCP Cloud Run & Cloud SQL Deployment
steps:
  # -------------------------------------------------------------------------
  # Step 1: Build Backend Docker Image
  # -------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend-image'
    dir: 'Backend'
    args:
      - 'build'
      - '-t'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/seafudz-backend:$COMMIT_SHA'
      - '-t'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/seafudz-backend:latest'
      - '.'

  # -------------------------------------------------------------------------
  # Step 2: Push Backend Image to GCP Artifact Registry
  # -------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend-image'
    args:
      - 'push'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/seafudz-backend:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend-image-latest'
    args:
      - 'push'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/seafudz-backend:latest'

  # -------------------------------------------------------------------------
  # Step 3: Run Database Migrations on GCP Cloud SQL (Gracefully handles unconfigured DB)
  # -------------------------------------------------------------------------
  - name: 'node:22'
    id: 'run-database-migrations'
    dir: 'Backend'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'npm ci && (npm run migrate || true)'

  # -------------------------------------------------------------------------
  # Step 4: Deploy Backend Container to GCP Cloud Run
  # -------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-backend-cloudrun'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'seafudz-backend'
      - '--image'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/seafudz-backend:$COMMIT_SHA'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--set-env-vars'
      - 'NODE_ENV=production'

  # -------------------------------------------------------------------------
  # Step 5: Install Dependencies & Build Frontend Production Assets
  # -------------------------------------------------------------------------
  - name: 'node:22'
    id: 'build-frontend'
    dir: 'Frontend'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'npm ci && npm run build'

  # -------------------------------------------------------------------------
  # Step 6: Deploy Frontend Static Distribution to Firebase Hosting
  # -------------------------------------------------------------------------
  - name: 'node:22'
    id: 'deploy-frontend-firebase'
    env:
      - 'FIREBASE_TOKEN=${_FIREBASE_TOKEN}'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'npx -y firebase-tools deploy --only hosting --project seafudz-ng-bayan --non-interactive'

# Store artifact images in GCP Artifact Registry
images:
  - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/seafudz-backend:$COMMIT_SHA'
  - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/seafudz-backend:latest'

# Pipeline execution configuration
timeout: '1200s'
options:
  logging: 'CLOUD_LOGGING_ONLY'
